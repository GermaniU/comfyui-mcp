name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv < 0.13.4 still trusts the compromised emSign CA. Exact version and
          # the SHA-256 of uv-x86_64-unknown-linux-gnu.tar.gz from the 0.13.4
          # release: this setup-uv has no known checksum for it, so without
          # `checksum` the binary would be installed unverified.
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen
        # Fresh base image and no layer cache, so a CA store or pip from an older
        # build cannot be reused.
        run: docker build --pull --no-cache -t comfyui-mcp:ci .

      - name: El label del registry coincide con server.json
        run: |
          LABEL=$(docker inspect -f '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' comfyui-mcp:ci)
          NAME=$(jq -r .name server.json)
          echo "label=$LABEL  server.json=$NAME"
          test "$LABEL" = "$NAME"

      - name: Smoke test stdio del contenedor
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run -i --rm comfyui-mcp:ci --stdio > /tmp/out.json
          cat /tmp/out.json
          grep -q '"serverInfo"' /tmp/out.json

      - name: emSign ECC Root CA - G3 absent from the image (by fingerprint)
        run: |
          docker run --rm --network none --user 0 --entrypoint python \
            -v "$PWD/scripts/check_ca_bundles.py:/tmp/check_ca_bundles.py:ro" \
            comfyui-mcp:ci /tmp/check_ca_bundles.py
