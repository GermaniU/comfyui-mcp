name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/germaniu/comfyui-mcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Fresh base image and no layer cache (emSign CA incident).
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publica server.json en el MCP Registry (registry.modelcontextprotocol.io).
  # Login por OIDC de GitHub Actions: sin secretos, el registry solo concede el
  # namespace io.github.GermaniU/*. Requiere que la imagen de GHCR sea pública.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versión e imagen de server.json desde el tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = "ghcr.io/germaniu/comfyui-mcp:" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Instalar mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publicar
        run: ./mcp-publisher publish
